<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Money - Simulateur</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <!-- En-tête avec logo -->
    <div class="header">
      <div class="logo">
        <span>YOUR MONEY</span>
      </div>
      <div class="header-text">
        <h2>Your Money</h2>
        <p class="subtitle" id="sub-title">Simulateur de transfert Gabon ➔ Maroc</p>
      </div>
    </div>

    <!-- Sélecteur de pays -->
    <div class="country-selector">
      <div class="country-box">
        <span class="flag" id="from-flag">🇬🇦</span>
        <div class="country-info">
          <span class="label">De</span>
          <strong id="from-country">Gabon</strong>
        </div>
      </div>
      <button type="button" class="swap-icon" id="swap-btn" title="Inverser le sens">⇆</button>
      <div class="country-box">
        <span class="flag" id="to-flag">🇲🇦</span>
        <div class="country-info">
          <span class="label">Vers</span>
          <strong id="to-country">Maroc</strong>
        </div>
      </div>
    </div>

    <!-- Onglets J'envoie / Je veux recevoir -->
    <div class="mode-tabs">
      <button type="button" class="tab active" id="tab-send">J'envoie</button>
      <button type="button" class="tab" id="tab-receive">Je veux recevoir</button>
    </div>

    <!-- Champ de saisie avec cadre rouge -->
    <div class="input-group">
      <label for="amount" id="amount-label">Montant envoyé (FCFA)</label>
      <div class="input-wrapper red-border">
        <input type="number" id="amount" value="280000">
        <div class="currency-tag">
          <span id="input-flag">🇬🇦</span> <span id="input-currency">FCFA</span>
        </div>
      </div>
    </div>

    <p class="info-note" id="info-note">Les frais sont déduits du montant envoyé.</p>

    <!-- Détail de l'opération -->
    <div class="details">
      <h3>📋 Détail de l'opération</h3>
      <div class="row">
        <span><span id="flag-send">🇬🇦</span> Montant envoyé</span>
        <span id="display-amount">280 000 FCFA</span>
      </div>
      <div class="row fee">
        <span>Frais (3%)</span>
        <span id="display-fee">-8 400 FCFA</span>
      </div>
      <div class="row total">
        <span><span id="flag-net">🇬🇦</span> Montant net</span>
        <span id="display-net">271 600 FCFA</span>
      </div>
      <div class="row total mad">
        <span><span id="flag-receive">🇲🇦</span> Montant reçu</span>
        <span id="display-converted">4 526,67 MAD</span>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
